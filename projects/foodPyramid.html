<DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="John Dean">
<style>
  th {
    background-color: green;
    color: white;}
  table, tr > * {
    border-collapse: collapse;
    border: thin solid black;
  }
  body {
    display: flex;
    justify-content: center;}
</style>
</head>
<body>
  <h1>USDA Food Pyramid</h1>
  <table>
    <tr>
      <th></th><th colspan="2">Serving Guidelines</th>
    </tr>
    <tr>
      <th>Food Group</th><th>2005-2010</th><th>2011-present</th>
    </tr>
    <tr>
      <td><b>Dairy</b><br>(milk, yogurt, cheese)</td><td>2-3</td><td>3-4</td>
    </tr>
    <tr>
      <td><b>Meat and Beans</b><br>(beef, poultry, fish, beans)</td><td>2-3</td><td>5-6</td>
    </tr>
    <tr>
      <td><b>Fruits</b></td><td>2-4</td><td>2-4</td>
    </tr>
    <tr>
      <td><b>Vegetables</b></td><td>3-5</td><td>1-2</td>
    </tr>
    <tr>
      <td><b>Grains</b><br>(bread, donuts, pop tarts)</td><td>1-2</td><td>3-5</td>
    </tr>
  </table>

</body>
</html>
