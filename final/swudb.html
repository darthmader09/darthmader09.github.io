  <main><h1 style="color: darkblue;">Star Wars Unlimited database.</main>
  <section><iframe src="https://swudb.com" title="SWUDB" loading="lazy" style="width: 50%; height: 800px;"></section> <!-- inline style -->
  <aside>
    <p>SWUDB.com is essentially one of the main online tools used by players of Star Wars: Unlimited, functioning as a 
    comprehensive card database and deck-building platform. Its core use is letting players browse every card in the game—searching by traits 
    like faction, cost, abilities, or set—so they can understand the card pool and plan strategies. Beyond just viewing cards, it acts as a 
    full deck builder where users can create, edit, and save decks digitally, often using filters and sorting tools to fine-tune synergy and balance. 
    It also hosts public decklists, allowing players to explore popular or “meta” builds, learn from others, and get inspiration for their own decks.
    </p>
    <p>
    On top of that, SWUDB plays a central role in the broader community ecosystem. It allows users to share decks, discuss strategies, and even export decklists in formats used by online play simulators, meaning it connects directly with tools that let people test or play games digitally. Many players also use it to track their card collections and see what they’re missing for specific decks, making it useful for both casual players and competitive ones preparing for tournaments. Overall, it acts as a hub for learning the game, building decks efficiently, and engaging with the wider player community—all in one place.</p></aside>
