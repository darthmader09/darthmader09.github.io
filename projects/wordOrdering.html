<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word Ordering</title>
  <script defer src="wordOrdering.js"></script>
  <style>
    body {
      font-family: Georgia, serif;
      margin: 40px;
    }
    h1 {
      font-size: 36px;
    }
    input {
      width: 400px;
      padding: 5px;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      margin-right: 10px;
      padding: 6px 10px;
      font-size: 14px;
    }
    #error {
      color: black;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>Word Ordering</h1>

  <p>Enter a list of words separated by spaces.</p>

  <label>Word list:</label>
  <input type="text" id="wordInput">

  <br>

  <button onclick="handleSort('alpha')">Alphabetical</button>
  <button onclick="handleSort('reverse')">Reverse alphabetical</button>
  <button onclick="handleSort('random')">Random</button>

  <p id="error"></p>

</body>
</html>
