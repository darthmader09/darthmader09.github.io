  <main>
    <h1>Win tracker.</h1>
   <form>
     <legend>Color</legend>
     <label><input type="checkbox" name="color" value="Red">Red</label><br> <!-- labels for accessibility -->
     <label><input type="checkbox" name="color" value="Yellow">Yellow</label><br>
     <label><input type="checkbox" name="color" value="Green">Green</label><br>
     <label><input type="checkbox" name="color" value="Blue">Blue</label><br>
     <label><input type="checkbox" name="color" value="Hero">Hero</label><br>
     <label><input type="checkbox" name="color" value="Villain">Villain</label><br>
     <legend>Archetype</legend>
     <label><input type="radio" name="archetype"value="Aggressive">Aggressive </label>&nbsp;
     <label><input type="radio" name="archetype"value="Midrange">Midrange </label>&nbsp;
     <label><input type="radio" name="archetype"value="Control">Control </label>&nbsp;
     <legend>Wins</legend>
     <label><input type="number" name="wins" step="1"></label>
     <legend>Total Games</legend>
     <label><input type="number" name="total" step="1"></label>
   </form>
  </main>
